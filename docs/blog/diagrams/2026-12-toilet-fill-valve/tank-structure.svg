<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="'Noto Sans KR', 'WenQuanYi Zen Hei', sans-serif">
  <title>양변기 물탱크 속 구조와 물이 도는 길 — 고장도감 제작 구조도</title>
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d6fd6"/>
    </marker>
    <marker id="lead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#1f2937"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="800" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="44" font-size="26" font-weight="700" fill="#111827">양변기 물탱크 속 구조와 물이 도는 길</text>
  <text x="40" y="74" font-size="16" fill="#4b5563">투피스 변기 예시 · 부품 모양과 자리는 제품마다 다릅니다</text>

  <!-- wall -->
  <rect x="28" y="430" width="26" height="268" fill="#e5e7eb"/>
  <text x="41" y="422" font-size="14" fill="#6b7280" text-anchor="middle">벽</text>

  <!-- toilet bowl body (below tank) -->
  <path d="M250,505 L700,505 L700,560 Q700,650 600,680 L380,680 Q300,660 290,600 Z" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
  <text x="560" y="625" font-size="15" fill="#6b7280" text-anchor="middle">변기 본체</text>

  <!-- tank lid -->
  <rect x="232" y="100" width="486" height="22" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="3"/>
  <!-- tank shell -->
  <rect x="246" y="122" width="458" height="383" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="4"/>
  <!-- water -->
  <rect x="262" y="262" width="426" height="228" fill="#dbeafe"/>
  <line x1="262" y1="262" x2="688" y2="262" stroke="#1d6fd6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="676" y="254" font-size="14" fill="#1d4ed8" text-anchor="end">수위</text>

  <!-- overflow pipe -->
  <rect x="566" y="214" width="22" height="262" fill="#ffffff" stroke="#374151" stroke-width="3"/>
  <!-- flush valve seat and outlet -->
  <rect x="520" y="470" width="114" height="20" rx="4" fill="#d1d5db" stroke="#374151" stroke-width="3"/>
  <rect x="548" y="490" width="58" height="36" fill="#d1d5db" stroke="#374151" stroke-width="3"/>
  <!-- flapper -->
  <path d="M516,468 Q577,446 638,468 L638,474 L516,474 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <!-- lever and chain -->
  <rect x="226" y="150" width="34" height="18" rx="4" fill="#6b7280"/>
  <line x1="258" y1="159" x2="540" y2="159" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <line x1="538" y1="162" x2="546" y2="452" stroke="#6b7280" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- fill valve: shank through tank bottom, body, head -->
  <rect x="314" y="488" width="26" height="44" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
  <rect x="316" y="200" width="22" height="290" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
  <rect x="300" y="182" width="54" height="26" rx="6" fill="#9ca3af" stroke="#374151" stroke-width="3"/>
  <!-- float (cup around the body) -->
  <rect x="298" y="266" width="58" height="52" rx="8" fill="#fde68a" stroke="#92400e" stroke-width="3"/>

  <!-- supply: angle valve on wall, hose up to the fill valve shank -->
  <rect x="54" y="590" width="44" height="22" fill="#9ca3af" stroke="#374151" stroke-width="3"/>
  <rect x="66" y="560" width="20" height="30" rx="3" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
  <path d="M98,601 C200,601 327,640 327,532" fill="none" stroke="#6b7280" stroke-width="9" stroke-linecap="round"/>

  <!-- water flow -->
  <path d="M110,628 C200,632 300,660 312,560" fill="none" stroke="#1d6fd6" stroke-width="3" marker-end="url(#flow)"/>
  <path d="M356,195 C390,195 400,215 404,236" fill="none" stroke="#1d6fd6" stroke-width="3" marker-end="url(#flow)"/>

  <!-- labels: left side -->
  <line x1="300" y1="194" x2="160" y2="230" stroke="#1f2937" stroke-width="1.5" marker-start="url(#lead)"/>
  <text x="40" y="238" font-size="17" font-weight="700" fill="#111827">필밸브</text>
  <text x="40" y="260" font-size="14" fill="#374151">(급수밸브·볼탑)</text>
  <text x="40" y="281" font-size="14" fill="#374151">물을 채우고 수위가</text>
  <text x="40" y="300" font-size="14" fill="#374151">차면 멈추는 부속</text>

  <line x1="298" y1="300" x2="170" y2="344" stroke="#1f2937" stroke-width="1.5" marker-start="url(#lead)"/>
  <text x="40" y="350" font-size="17" font-weight="700" fill="#111827">부자(플로트)</text>
  <text x="40" y="371" font-size="14" fill="#374151">물에 떠오르며</text>
  <text x="40" y="390" font-size="14" fill="#374151">급수를 막습니다</text>

  <line x1="226" y1="159" x2="96" y2="141" stroke="#1f2937" stroke-width="1.5" marker-start="url(#lead)"/>
  <text x="40" y="146" font-size="17" font-weight="700" fill="#111827">레버</text>

  <line x1="76" y1="560" x2="104" y2="510" stroke="#1f2937" stroke-width="1.5" marker-start="url(#lead)"/>
  <text x="70" y="478" font-size="17" font-weight="700" fill="#111827">앵글밸브</text>
  <text x="70" y="499" font-size="14" fill="#374151">작업 전에 잠급니다</text>

  <line x1="190" y1="611" x2="160" y2="676" stroke="#1f2937" stroke-width="1.5" marker-start="url(#lead)"/>
  <text x="90" y="696" font-size="17" font-weight="700" fill="#111827">급수호스</text>

  <!-- labels: right side -->
  <line x1="588" y1="220" x2="730" y2="200" stroke="#1f2937" stroke-width="1.5" marker-start="url(#lead)"/>
  <text x="736" y="196" font-size="17" font-weight="700" fill="#111827">오버플로관</text>
  <text x="736" y="217" font-size="14" fill="#374151">수위는 이 관</text>
  <text x="736" y="236" font-size="14" fill="#374151">꼭대기보다 아래</text>

  <line x1="634" y1="480" x2="730" y2="430" stroke="#1f2937" stroke-width="1.5" marker-start="url(#lead)"/>
  <text x="736" y="426" font-size="17" font-weight="700" fill="#111827">플러시밸브</text>
  <text x="736" y="447" font-size="14" fill="#374151">물을 내리는 출구</text>

  <line x1="626" y1="462" x2="730" y2="346" stroke="#1f2937" stroke-width="1.5" marker-start="url(#lead)"/>
  <text x="736" y="336" font-size="17" font-weight="700" fill="#111827">고무마개</text>
  <text x="736" y="357" font-size="14" fill="#374151">(플래퍼) 레버를</text>
  <text x="736" y="376" font-size="14" fill="#374151">누르면 들립니다</text>

  <!-- how to tell the two faults apart -->
  <rect x="40" y="716" width="400" height="62" rx="8" fill="#eff6ff" stroke="#1d6fd6" stroke-width="2"/>
  <text x="56" y="742" font-size="15" font-weight="700" fill="#1e3a8a">물이 오버플로관 꼭대기로 넘쳐 흐름</text>
  <text x="56" y="765" font-size="14" fill="#1e3a8a">필밸브가 급수를 못 막는 쪽입니다(이 글)</text>
  <rect x="460" y="716" width="400" height="62" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <text x="476" y="742" font-size="15" font-weight="700" fill="#374151">수위는 낮은데 물이 변기로 샘</text>
  <text x="476" y="765" font-size="14" fill="#374151">고무마개·플러시밸브 쪽입니다(다른 부품)</text>

  <!-- credit -->
  <text x="860" y="74" font-size="13" fill="#6b7280" text-anchor="end">고장도감 제작 구조도</text>
</svg>

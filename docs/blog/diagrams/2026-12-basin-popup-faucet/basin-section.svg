<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="'WenQuanYi Zen Hei', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <title>반다리 세면대 단면 구조도 — 고장도감 제작 구조도</title>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e5e7eb"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9ca3af" stroke-width="2"/>
    </pattern>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7">
      <circle cx="5" cy="5" r="4" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="900" height="770" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="38" font-size="24" font-weight="bold" fill="#111827">반다리 세면대 단면 구조도 (옆에서 본 모습)</text>
  <text x="30" y="62" font-size="15" fill="#4b5563">막대식(수동) 폽업 기준입니다. 물마개를 눌러 여닫는 자동 폽업에는 막대 연결부가 없습니다.</text>

  <!-- wall and floor -->
  <rect x="30" y="80" width="60" height="620" fill="url(#hatch)" stroke="#6b7280" stroke-width="1.5"/>
  <text x="44" y="104" font-size="16" font-weight="bold" fill="#374151">벽</text>
  <rect x="30" y="700" width="560" height="16" fill="url(#hatch)" stroke="#6b7280" stroke-width="1.5"/>
  <text x="520" y="694" font-size="15" fill="#374151">바닥</text>

  <!-- supply pipe and drain pipe inside the wall -->
  <rect x="58" y="560" width="14" height="140" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
  <rect x="44" y="472" width="46" height="18" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <rect x="44" y="472" width="16" height="228" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>

  <!-- half pedestal (in front, dashed) -->
  <path d="M95,342 L452,342 Q462,342 462,352 L462,610 Q462,640 432,640 L95,640" fill="#f8fafc" fill-opacity="0.35" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="10 7"/>
  <line x1="300" y1="646" x2="300" y2="696" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M294,652 L300,642 L306,652 M294,690 L300,700 L306,690" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="310" y="676" font-size="14" fill="#6d28d9">바닥에 닿지 않음</text>

  <!-- trap (wall drain) -->
  <path d="M350,430 L350,505 Q350,550 305,550 Q262,550 262,505 L262,481 L90,481" fill="none" stroke="#4b5563" stroke-width="18" stroke-linejoin="round"/>
  <path d="M350,430 L350,505 Q350,550 305,550 Q262,550 262,505 L262,481 L90,481" fill="none" stroke="#d1d5db" stroke-width="12" stroke-linejoin="round"/>

  <!-- angle valve + hoses -->
  <rect x="90" y="584" width="30" height="22" rx="4" fill="#d4d4d8" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="120" y="588" width="14" height="14" rx="3" fill="#2563eb" stroke="#1e3a8a" stroke-width="1"/>
  <line x1="72" y1="595" x2="90" y2="595" stroke="#2563eb" stroke-width="8"/>
  <path d="M106,584 C 106,520 168,470 160,380 C 154,310 140,270 136,232" fill="none" stroke="#64748b" stroke-width="7"/>
  <path d="M106,584 C 106,520 168,470 160,380 C 154,310 140,270 136,232" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="3 3"/>
  <path d="M112,584 C 114,526 182,472 174,382 C 168,312 150,272 146,232" fill="none" stroke="#64748b" stroke-width="7"/>
  <path d="M112,584 C 114,526 182,472 174,382 C 168,312 150,272 146,232" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="3 3"/>

  <!-- basin (ceramic) -->
  <path d="M90,190 L575,190 Q590,190 590,205 L590,226 Q590,240 576,249 L470,330 Q446,348 410,348 L286,348 Q252,348 232,330 L184,244 Q174,228 158,228 L90,228 Z" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <path d="M192,198 L560,198 Q568,206 560,214 L456,304 Q438,320 410,320 L292,320 Q268,320 254,306 L200,222 Q192,210 192,198 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="400" y="262" font-size="15" fill="#1e3a8a" text-anchor="middle">세면기</text>

  <!-- faucet on the deck -->
  <rect x="122" y="128" width="30" height="62" rx="4" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <path d="M152,140 L232,140 Q240,140 240,148 L240,158 L226,158 L226,154 L152,154 Z" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <line x1="137" y1="128" x2="186" y2="110" stroke="#334155" stroke-width="5" stroke-linecap="round"/>

  <!-- under-deck fixing: stud bolt, horseshoe washer, packing -->
  <rect x="134" y="228" width="6" height="36" fill="#475569"/>
  <rect x="124" y="232" width="26" height="5" fill="#111827"/>
  <path d="M122,242 L152,242 L152,250 L142,250 L142,246 L132,246 L132,250 L122,250 Z" fill="#a1a1aa" stroke="#3f3f46" stroke-width="1"/>
  <rect x="129" y="254" width="16" height="8" fill="#52525b"/>

  <!-- lift rod (behind the spout) -->
  <line x1="112" y1="96" x2="112" y2="440" stroke="#b45309" stroke-width="4"/>
  <circle cx="112" cy="92" r="6" fill="#b45309"/>

  <!-- pop-up: stopper, drain body, pivot rod, nut, strap, spring clip -->
  <rect x="333" y="304" width="34" height="9" rx="3" fill="#a1a1aa" stroke="#3f3f46" stroke-width="1.5"/>
  <line x1="350" y1="313" x2="350" y2="408" stroke="#3f3f46" stroke-width="2"/>
  <rect x="338" y="346" width="24" height="88" fill="#d4d4d8" stroke="#3f3f46" stroke-width="2"/>
  <rect x="330" y="350" width="40" height="8" fill="#71717a"/>
  <polygon points="324,398 338,398 338,414 324,414" fill="#52525b"/>
  <line x1="352" y1="406" x2="118" y2="406" stroke="#0f766e" stroke-width="4"/>
  <rect x="104" y="376" width="16" height="66" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="112" cy="386" r="2.6" fill="#374151"/>
  <circle cx="112" cy="396" r="2.6" fill="#374151"/>
  <circle cx="112" cy="406" r="2.6" fill="#374151"/>
  <circle cx="112" cy="416" r="2.6" fill="#374151"/>
  <circle cx="112" cy="426" r="2.6" fill="#374151"/>
  <path d="M122,399 L128,404 L122,408 L128,413" fill="none" stroke="#dc2626" stroke-width="2"/>
  <rect x="97" y="380" width="6" height="8" fill="#374151"/>

  <!-- labels -->
  <g font-size="15" fill="#111827">
    <line x1="612" y1="104" x2="118" y2="92" stroke="#9ca3af" stroke-width="1" marker-end="url(#dot)"/>
    <text x="618" y="100" font-weight="bold">리프트 로드</text>
    <text x="618" y="118" font-size="13" fill="#4b5563">수전 뒤에서 당겨 올리는 막대</text>

    <line x1="612" y1="156" x2="196" y2="146" stroke="#9ca3af" stroke-width="1" marker-end="url(#dot)"/>
    <text x="618" y="160" font-weight="bold">원홀 수전</text>

    <line x1="612" y1="206" x2="152" y2="246" stroke="#9ca3af" stroke-width="1" marker-end="url(#dot)"/>
    <text x="618" y="202" font-weight="bold">스터드 볼트·말굽 와셔·와셔 패킹</text>
    <text x="618" y="220" font-size="13" fill="#4b5563">세면기 아래에서 수전을 고정</text>

    <line x1="612" y1="262" x2="368" y2="306" stroke="#9ca3af" stroke-width="1" marker-end="url(#dot)"/>
    <text x="618" y="266" font-weight="bold">물마개(폽업 마개)</text>

    <line x1="612" y1="320" x2="362" y2="380" stroke="#9ca3af" stroke-width="1" marker-end="url(#dot)"/>
    <text x="618" y="316" font-weight="bold">폽업 배수 몸통</text>
    <text x="618" y="334" font-size="13" fill="#4b5563">세면기 배수구에 끼우는 부속</text>

    <line x1="612" y1="378" x2="331" y2="404" stroke="#9ca3af" stroke-width="1" marker-end="url(#dot)"/>
    <text x="618" y="374" font-weight="bold">피벗 로드·피벗 로드 너트</text>
    <text x="618" y="392" font-size="13" fill="#4b5563">배수 몸통 뒤쪽에 꽂히는 가로 막대</text>

    <line x1="612" y1="436" x2="126" y2="420" stroke="#9ca3af" stroke-width="1" marker-end="url(#dot)"/>
    <text x="618" y="432" font-weight="bold">리프트 로드 스트랩·스프링 클립</text>
    <text x="618" y="450" font-size="13" fill="#4b5563">구멍 난 금속판, 높이 조정 나사</text>

    <line x1="612" y1="498" x2="168" y2="430" stroke="#9ca3af" stroke-width="1" marker-end="url(#dot)"/>
    <text x="618" y="502" font-weight="bold">세면기 호스(온수·냉수)</text>

    <line x1="612" y1="552" x2="306" y2="552" stroke="#9ca3af" stroke-width="1" marker-end="url(#dot)"/>
    <text x="618" y="548" font-weight="bold">트랩(벽배수)</text>
    <text x="618" y="566" font-size="13" fill="#4b5563">바닥배수형은 아래로 빠짐</text>

    <line x1="612" y1="604" x2="136" y2="595" stroke="#9ca3af" stroke-width="1" marker-end="url(#dot)"/>
    <text x="618" y="600" font-weight="bold">앵글밸브(온수·냉수)</text>
    <text x="618" y="618" font-size="13" fill="#4b5563">작업 전에 먼저 잠그는 곳</text>

    <line x1="612" y1="652" x2="464" y2="620" stroke="#9ca3af" stroke-width="1" marker-end="url(#dot)"/>
    <text x="618" y="656" font-weight="bold" fill="#6d28d9">반다리 덮개(앞쪽, 점선)</text>
    <text x="618" y="674" font-size="13" fill="#4b5563">내려야 호스·밸브에 손이 닿음</text>
  </g>

  <!-- footer -->
  <line x1="30" y1="726" x2="870" y2="726" stroke="#e5e7eb" stroke-width="1"/>
  <text x="30" y="748" font-size="13" fill="#374151">고장도감 제작 구조도 · 부품 이름: 이누스 고객지원 수전 교체 안내, Moen 고객지원 폽업 안내, 한샘 BATHEM 카탈로그</text>
  <text x="30" y="764" font-size="12" fill="#6b7280">설명용 그림이며 실제 제품의 모양·치수·배관 위치와 다를 수 있습니다.</text>
</svg>
